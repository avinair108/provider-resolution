# Model profiles. Code picks one by name: LLM.from_config("default"). Keys live in .env, never here.
# Switching provider later means adding an adapter in llm/providers/ and a profile here; callers don't change.

[default]
provider = "groq"
# Groq model IDs carry no date, so each response also records the served model and system_fingerprint.
# `python -m llm.check` confirms this ID is available on your key.
model = "openai/gpt-oss-120b"
temperature = 0.0
max_tokens = 2048
# Reasoning models: thinking tokens come out of max_tokens. low | medium | high.
effort = "low"
# Cap on live (uncached) calls per run. The free tier allows about 1,000 requests a day on the larger models;
# leave headroom for retries and quick tests. Cached calls don't count.
max_live_calls = 800
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0
cache_dir = ".cache/llm"
usage_log = ".cache/llm/usage.jsonl"

# A smaller, faster model, for smoke tests and prompt iteration.
[small]
provider = "groq"
model = "openai/gpt-oss-20b"
temperature = 0.0
max_tokens = 2048
# Reasoning models: thinking tokens come out of max_tokens. low | medium | high.
effort = "low"
max_live_calls = 5000
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0
cache_dir = ".cache/llm"
usage_log = ".cache/llm/usage.jsonl"
