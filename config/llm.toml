# Model profiles. Code picks one by name: LLM.from_config("default"). Keys live in .env, never here.

[budget]
# Total spend allowed on the project's OpenRouter account, all runs together. Each run is capped at what's left.
project_cap_usd = 20.0
# Switching provider later means adding an adapter in llm/providers/ and a profile here; callers don't change.

[default]
provider = "groq"
# Groq model IDs carry no date, so each response also records the served model and system_fingerprint.
# `python -m llm.check` confirms this ID is available on your key.
model = "openai/gpt-oss-120b"
temperature = 0.0
max_tokens = 2048
# Reasoning models: thinking tokens come out of max_tokens. low | medium | high.
effort = "low"
# Cap on live (uncached) calls per run. The free tier allows about 1,000 requests a day on the larger models;
# leave headroom for retries and quick tests. Cached calls don't count.
max_live_calls = 800
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0
cache_dir = ".cache/llm"
usage_log = ".cache/llm/usage.jsonl"

# A smaller, faster model, for smoke tests and prompt iteration.
[small]
provider = "groq"
model = "openai/gpt-oss-20b"
temperature = 0.0
max_tokens = 2048
# Reasoning models: thinking tokens come out of max_tokens. low | medium | high.
effort = "low"
max_live_calls = 5000
price_input_per_mtok = 0.0
price_output_per_mtok = 0.0
cache_dir = ".cache/llm"
usage_log = ".cache/llm/usage.jsonl"

# OpenRouter profiles: one host and precision each, no fallbacks, so reruns hit the same deployment.
# max_cost_usd caps each run's live spend (a full Texas run with 3 repeats fits); override with --max-cost.
# Prices are estimates for planning; the client records what OpenRouter actually charged.
[or-120b]
provider = "openrouter"
model = "openai/gpt-oss-120b"
host = "deepinfra"
quantization = "bf16"
temperature = 0.0
max_tokens = 2048
effort = "low"
max_live_calls = 20000
max_cost_usd = 1.0
price_input_per_mtok = 0.037
price_output_per_mtok = 0.17
cache_dir = ".cache/llm"
usage_log = ".cache/llm/usage.jsonl"

[or-20b]
provider = "openrouter"
model = "openai/gpt-oss-20b"
host = "deepinfra"
quantization = "bf16"
temperature = 0.0
max_tokens = 2048
effort = "low"
max_live_calls = 20000
max_cost_usd = 1.0
price_input_per_mtok = 0.03
price_output_per_mtok = 0.14
cache_dir = ".cache/llm"
usage_log = ".cache/llm/usage.jsonl"

# Claude through OpenRouter, pinned to Anthropic's own endpoint. Anthropic's endpoint takes no temperature or seed,
# so they're left out of the request (they stay in the cache key). Repeats differ by candidate order only.
[or-haiku]
provider = "openrouter"
model = "anthropic/claude-haiku-5.5"
host = "anthropic"
omit = ["temperature", "seed"]
temperature = 0.0
max_tokens = 2048
effort = "low"
max_live_calls = 20000
max_cost_usd = 3.0
price_input_per_mtok = 0.10
price_output_per_mtok = 0.50
cache_dir = ".cache/llm"
usage_log = ".cache/llm/usage.jsonl"

# Host check: the same gpt-oss-120b, pinned to Groq instead of DeepInfra bf16. Groq doesn't publish its precision.
[or-120b-groq]
provider = "openrouter"
model = "openai/gpt-oss-120b"
host = "groq"
temperature = 0.0
max_tokens = 2048
effort = "low"
max_live_calls = 20000
max_cost_usd = 2.0
price_input_per_mtok = 0.15
price_output_per_mtok = 0.60
cache_dir = ".cache/llm"
usage_log = ".cache/llm/usage.jsonl"
