# Pinned source files. Checked against the CMS catalogs on 2026-11-04.
# NPPES is a full-replacement monthly file: update the pin deliberately, never silently.

[nppes]
# The untouched CMS monthly file of 2024-12-09, archived by NBER. CMS keeps only the latest month, and the current
# file is nearly two years newer than the 2024 activity it would be compared against.
url = "https://data.nber.org/npi/zip/2024/npi_raw_202412.zip"
snapshot = "2024-12"

