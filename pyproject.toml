[project]
name = "provider-resolution"
version = "0.1.0"
description = "Eval-first agentic RAG over CMS provider datasets with hidden-NPI gold"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0",
    "splink>=5.0,<6",
    "scikit-learn>=1.5",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["pipeline*", "evals*", "matching*", "llm*", "adjudicate*", "graph*", "qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
